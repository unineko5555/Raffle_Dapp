# Raffle DApp - Docker Compose Configuration
# Updated: 2025-06-26

services:
  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:rw
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_ALCHEMY_API_KEY=${ALCHEMY_API_KEY:-demo_key}
      - NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${WALLETCONNECT_PROJECT_ID:-demo_id}
    command: npm run dev -- -H 0.0.0.0
    depends_on:
      - backend
    networks:
      - raffle-network

  backend:
    build:
      context: ./backend
    ports:
      - "8545:8545"  # Anvil local chain
    volumes:
      - ./backend:/app
    environment:
      - ANVIL_IP_ADDR=0.0.0.0
    command: >
      bash -c "anvil --host 0.0.0.0 --chain-id 31337 --accounts 10 --balance 1000 & 
               sleep 3 && 
               forge script script/RaffleProxyDeployer.s.sol --broadcast --rpc-url http://localhost:8545 --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 || echo 'Local deployment failed, but development can continue' && 
               tail -f /dev/null"
    networks:
      - raffle-network

  # Indexer service (optional)
  indexer:
    build:
      context: ./raffleIndexer
    volumes:
      - ./raffleIndexer:/app
    environment:
      - NODE_ENV=development
    profiles:
      - indexer
    networks:
      - raffle-network

networks:
  raffle-network:
    driver: bridge